<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pseudoclases</title>
    <style>
        div{
            background-color: lightgray;
            text-align: center;
            width: 200px;
            height: 200px;
            vertical-align: middle;
            border: 2px solid black;
            display: inline-block;
        }
        div:hover{
            background-color: rgba(211, 211, 211, 0.433);
        }
    </style>
</head>
<body>
    <div id="d1">01</div>
    <div id="d2">02</div>
    <div id="d3">03</div>
</body>
</html>
