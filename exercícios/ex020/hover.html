<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exemplo de houver</title>
    <style>
        body{
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
           
            
        }
        div >p{
            display: none;
        }
        div:hover >p{
            display: block;
            color: chocolate;
            background-color: rgba(255, 235, 205, 0.452);
        }
        div:hover{
            color: crimson;
            
        }    
    </style>
</head>
<body>
    <h1>exemplo de houver</h1>
    <p>passe o mouse sobre o texto</p>
    <div>
        passe o seu mouse aqui
        <p><ins>texto escondido...</ins> </p>
    
    </div>
        <p>fim do exemplo</p>
</body>
</html>
