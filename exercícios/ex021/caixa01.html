<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>modelo de caixas</title>
    <style>
        h1{
            background-color:#F0F4C3;
            height: 150px;
            width: 300px;
            border: 3px dashed rgb(255, 39, 39);
            /*ordem de comando top, right, bottom, left*/ 
            padding: 10px;
            margin: 20px 10px 45px 10px;
            outline: 5px dashed aqua;  
        }
        a{
           border-width: 2px; 
           border-style: dotted;
           border-color: #a46313db;
           color: #a23737db;
           padding-top: 10px;
           padding-right: 10px;
           padding-bottom: 10px;
           padding-left: 10px;
        }
        a:visited{color: #e50882c2;}
        a:active{color: rgba(172, 11, 172, 0.824);
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>paragrafos são exemplos de box-level, mas os <a href="#">links sao exemplos de caixas inline-level</a>vamos ver como isso funciona!</p>

</body>
</html>
